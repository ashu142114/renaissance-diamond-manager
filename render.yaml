services:
  - type: web
    name: renaissance-diamond-manager
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run setup && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
      - key: SCOPES
        value: read_products,write_products,read_publications,write_publications
      - key: SHOPIFY_DIAMOND_PRODUCT_ID
        value: gid://shopify/Product/8198431277149
      - key: DATABASE_URL
        fromDatabase:
          name: renaissance-diamond-db
          property: connectionString

databases:
  - name: renaissance-diamond-db
    plan: starter
    databaseName: renaissance_diamonds
